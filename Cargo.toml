[package]
name = "claude-detour"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Route Claude Desktop through an authenticated HTTP or SOCKS5 proxy"
authors = ["xpepelok <phonkuser0308@gmail.com>"]
repository = "https://github.com/xpepelok/claude-detour"
license = "MIT"
keywords = ["proxy", "socks5", "claude", "forwarder"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-detour"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
console = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
